repos:
-   repo: local
    hooks:
    -   id: bots
        name: Run bots
        entry: scripts/bots.sh --apply --files
        language: script
        require_serial: true
    -   id: sync-preamble
        name: Sync docs preamble macros
        entry: docs/scripts/sync-preamble.sh
        language: script
        pass_filenames: false

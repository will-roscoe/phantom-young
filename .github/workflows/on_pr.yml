name: pr

on:
    pull_request:
      branches: [ master ]
      paths-ignore:
        - 'docs/**'
        - 'README.md'

concurrency:
    group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
    cancel-in-progress: true
    
jobs:

    build:
        uses: ./.github/workflows/build.yml

    # PRs run DEBUG=no only (full_matrix: false, the default -- spelled out here
    # for anyone reading this file without also opening test.yml/mpi.yml). The
    # DEBUG=yes pass runs on push to master instead (on_push.yml), where it
    # covers every SETUP/MPI combination once per merge rather than once per PR
    # push.
    test:
        uses: ./.github/workflows/test.yml
        with:
          full_matrix: false

    coolingra:
        uses: ./.github/workflows/coolingra.yml

    mpi:
        uses: ./.github/workflows/mpi.yml
        with:
          full_matrix: false

    summary:

        # This name matches the branch protection requirement
        name: summary
        
        needs: [build, test, mpi, coolingra] 
        if: success() || failure() && github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
        - name: Check all jobs succeeded
          run: |
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "All build jobs succeeded"
            else
              echo "At least one job failed"
              exit 1
            fi

            if [[ "${{ needs.test.result }}" == "success" ]]; then
              echo "All test jobs succeeded"
            else
              echo "At least one test failed"
              exit 1
            fi
            
            if [[ "${{ needs.coolingra.result }}" == "success" ]]; then
              echo "Rad cooling approx jobs succeeded"
            else
              echo "At least one rad cooling approx test failed"
              exit 1
            fi

            if [[ "${{ needs.mpi.result }}" == "success" ]]; then
              echo "MPI jobs succeeded"
            else
              echo "At least one MPI job failed"
              exit 1
            fi

            echo "All tests succeeded"

name: mpi

on:
  workflow_call:
    inputs:
      full_matrix:
        description: >-
          Also run DEBUG=yes (doubles the job count). Same rationale as
          test.yml's full_matrix input: PRs run DEBUG=no only; push to master
          runs both, since this matrix (2 debug x 2 openmp x 2 ntasks x 9
          setups = 72 jobs at full_matrix) is the single largest CI cost.
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        debug: ${{ inputs.full_matrix && fromJson('["no","yes"]') || fromJson('["no"]') }}
        openmp:
          - no
          - yes
        ntasks:
          - 1
          - 2
        input: # [SETUP, phantom_tests]
          - ['test', '']
          - ['testkd', '']
          - ['testdust', 'dust']
          - ['testgr', 'gr ptmass']
          - ['testgrav', 'gravity ptmass sinktree']
          - ['testgrowth', 'dustgrowth']
          - ['testnimhd', 'nimhd']
          - ['test2', '']
          - ['testcyl', '']

    name: |
      MPI test (SETUP=${{ matrix.input[0] }},
            targets=${{ matrix.input[1] }},
            DEBUG=${{ matrix.debug }},
            OPENMP=${{ matrix.openmp }},
            ntasks=${{ matrix.ntasks }})


    runs-on: ubuntu-latest

    env:
      OMP_STACKSIZE: 512M
      OMP_NUM_THREADS: 2

    steps:

    - name: Install gfortran and openMPI
      run: |
        sudo apt-get --yes update
        sudo apt-get --yes install gfortran openmpi-bin openmpi-common libopenmpi-dev

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Compile with MPI
      run: make SETUP=${{ matrix.input[0] }} MPI=yes NOWARN=yes DEBUG=${{ matrix.debug }} OPENMP=${{ matrix.openmp }}  phantomtest
      env:
        SYSTEM: gfortran

    - name: Test with MPI
      run: mpirun --allow-run-as-root -np ${{ matrix.ntasks }} --oversubscribe ./bin/phantomtest ${{ matrix.input[1] }}
